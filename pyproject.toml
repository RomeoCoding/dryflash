[project]
name = "esp32-sim-mcp"
version = "0.1.0"
description = "MCP server that builds ESP32 firmware, runs it in Espressif's QEMU, debugs it and feeds it sensor data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Romeo Mattar" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.2.0",
    "pygdbmi==0.11.0.0",
    "pyyaml==6.0.3",
    "pydantic==2.13.5",
]

[project.scripts]
esp32-sim-mcp = "esp32_sim_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "anyio==4.15.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esp32_sim_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Docker image (ESP-IDF, QEMU, GDB); run with -m integration",
    "sensors: needs the patched QEMU image with the sensor device",
]
addopts = "-m 'not integration and not sensors' --timeout=600"

[tool.ruff]
line-length = 110
target-version = "py312"
