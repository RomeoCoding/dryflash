name: mpu6050 model end to end
target: esp32
timeout_s: 120
emulator:
  deterministic: true
sensors:
  - model: mpu6050
    name: imu
    rate_hz: 1000
    waveform: {x: 0.5, y: -1.0, z: 1.0, gx: 100.0, gy: -10.0, gz: 0.5, temp_c: 25.0}
steps:
  - expect: 'who_am_i 0x68 pwr_mgmt_1 0x40'
    timeout_s: 60
  - expect: 'asleep afs0 fs0 raw=0,0,0,0,0,0,0 '
  - expect: 'reset bit clear after 0 polls, pwr_mgmt_1 0x40'
  - expect: 'awake pwr_mgmt_1 0x01 int_status 0x01'
  - expect: 'range afs0 fs0 raw=8192,-16384,16384,-3920,13100,-1310,66 '
  - expect: 'range afs3 fs3 raw=1024,-2048,2048,-3920,1640,-164,8 '
  - sensor_set: {sensor: imu, values: {x: -0.25}, at_ms: 2000}
  - expect: 'tick \d+ afs1 fs1 raw=-2048,-8192,8192,-3920,6550,-655,33 '
    timeout_s: 30
