name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The sensors image is built FROM the base image. buildx's docker-container builder (needed for the
# GitHub Actions layer cache) cannot see images loaded into the local Docker daemon, so each job
# runs a throwaway registry on localhost:5000: base images are pushed there and pulled back.

jobs:
  images-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      registry:
        image: registry:2
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the ESP-IDF image is ~13 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      # Base image (ESP-IDF v6.1 + server), test target with dev dependencies and test firmware.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          tags: localhost:5000/dryflash:test
          push: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      # Patched QEMU (qemu-patches/, GPL-2.0-or-later) on top of the test image. The QEMU build
      # stage is cached by the patch contents, so it only rebuilds when the patches change.
      - name: Build sensors test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/qemu-sensors.Dockerfile
          build-args: BASE_IMAGE=localhost:5000/dryflash:test
          tags: localhost:5000/dryflash:test-sensors
          push: true
          cache-from: type=gha,scope=qemu
          cache-to: type=gha,mode=max,scope=qemu

      - name: Pull test images
        run: |
          docker pull localhost:5000/dryflash:test-sensors
          docker tag localhost:5000/dryflash:test-sensors dryflash:test-sensors
          docker pull localhost:5000/dryflash:test
          docker tag localhost:5000/dryflash:test dryflash:test

      - name: Unit tests (QEMU-free)
        run: docker run --rm dryflash:test pytest -q

      - name: Integration tests (stock QEMU)
        run: docker run --rm dryflash:test pytest -q -m integration

      - name: Sensor injection tests (patched QEMU; includes the vibration_monitor demo run twice)
        run: docker run --rm dryflash:test-sensors pytest -q -m sensors

      - name: Demo app via the test-run CLI
        run: >
          docker run --rm dryflash:test-sensors
          test-run /opt/dryflash/examples/vibration_monitor scenario.yaml

  runtime-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      registry:
        image: registry:2
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the ESP-IDF image is ~13 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: base
          tags: localhost:5000/dryflash:latest
          push: true
          cache-from: type=gha,scope=base

      - name: Build sensors runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/qemu-sensors.Dockerfile
          build-args: BASE_IMAGE=localhost:5000/dryflash:latest
          tags: localhost:5000/dryflash-sensors:latest
          push: true
          cache-from: type=gha,scope=qemu

      - name: Smoke test the MCP server over stdio (client on the runner, server in Docker)
        run: |
          docker pull localhost:5000/dryflash:latest
          python3 -m venv /tmp/client && /tmp/client/bin/pip install -q mcp==2.2.0
          /tmp/client/bin/python scripts/smoke_session.py --docker localhost:5000/dryflash:latest
